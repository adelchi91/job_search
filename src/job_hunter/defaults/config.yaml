# Search profile. `job-hunter init` copies this to data/config.yaml; edit that copy.
roles:
  - Presales Engineer
  - Forward Deployed Engineer
  - AI Engineer
  - AI Architect
  - AI Solutions Engineer
# A title must contain one of these (case-insensitive) to be kept.
role_keywords:
  - presales
  - pre-sales
  - avant-vente
  - forward deployed
  - fde
  - solutions engineer
  - solution engineer
  - solutions architect
  - solution architect
  - ai engineer
  - ai architect
  - ml engineer
  - machine learning engineer
  - applied ai
  - llm engineer
  - genai
  - generative ai
  - sales engineer
  - customer engineer
  - ingénieur ia
  - ingénieur avant-vente
  - architecte ia
# A title containing one of these is dropped.
exclude_keywords:
  - intern
  - stage
  - stagiaire
  - alternance
  - apprenti
  - director
  - vp
  - head of
# Office locations accepted (matched against the posting location, accent-insensitive).
locations:
  - paris
  - ile-de-france
  - île-de-france
  - idf
  - la defense
  - boulogne-billancourt
  - issy-les-moulineaux
  - levallois-perret
  - neuilly-sur-seine
  - rueil-malmaison
  - nanterre
  - courbevoie
  - puteaux
  - saint-denis
  - saint-ouen
  - montreuil
  - pantin
  - clichy
  - saint-cloud
  - versailles
  - velizy
  - guyancourt
  - massy
  - palaiseau
  - saclay
# Remote postings are kept only if their location names one of these regions
# (a bare "Remote" or a remote role outside Europe is dropped).
remote_regions:
  - europe
  - emea
  - eu
  - eea
  - france
board_queries:
  - presales AI
  - forward deployed engineer
  - AI engineer
  - AI architect
  - AI solutions engineer
  - ingénieur avant-vente IA
fit_threshold: 60
max_open_per_company: 2
max_tailored_per_run: 15
score_model: claude-haiku-5-5
tailor_model: claude-sonnet-5-5
# Free AI with your own key: set GROQ_API_KEY and/or MISTRAL_API_KEY (or paste them in the
# dashboard, Settings -> AI provider). Both set: English jobs -> Groq, French jobs -> Mistral.
# Everything below is optional; uncomment to override the defaults.
# llm:
#   groq: {score_model: openai/gpt-oss-20b, tailor_model: openai/gpt-oss-120b}
#   mistral: {score_model: mistral-small-latest, tailor_model: mistral-large-latest}
#   route: {en: groq, fr: mistral}
#   prefer: byok        # or "claude": use Claude when available, your keys otherwise
#   retry_429: true     # retry once on a rate limit before falling back to heuristics
# Your name and contact details never go to the LLM. Set this to true to also replace
# your employers' names with [EMPLOYER_n] tokens in prompts (real names stay in the PDFs).
anonymise_employers: false
jobspy_sites: [linkedin, indeed, glassdoor]
# Free-tier LLM limits, per provider then per model ("default" applies to any model).
# rpm/rps = requests per minute/second, rpd = per day, tpm/tpd/tpmonth = tokens per
# minute/day/month. Rate-limit headers override the request numbers when the API sends them.
llm_limits:
  groq:  # console.groq.com/docs/rate-limits, checked 2026-11-16 (free plan)
    default: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
  mistral:  # PLACEHOLDER: copy the real numbers from admin.mistral.ai -> Limits
    default: {rps: 1, tpm: 500000, tpmonth: 1000000000}
profile:
  name: ""
  email: ""
  phone: ""
  linkedin: ""
  github: ""
  answers:
    notice_period: ""
    salary_expectation: ""
    work_authorisation: ""
    location: Paris, France

# Command that receives the daily digest markdown as its last argument (empty: file only).
# Example: ["/Applications/rev0.app/Contents/Resources/board/rev0", "comment", "3", "--author", "board", "-m"]
digest_command: []
