<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job hunter{% endblock %}</title>
<link rel="stylesheet" href="/static/midnight.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">job<span>·</span>hunter</a>
  {% if me %}
  {% set path = request.url.path %}
  <nav class="nav">
    <a href="/" class="{{ 'on' if path == '/' or path.startswith('/jobs') }}">Board</a>
    <a href="/files" class="{{ 'on' if path.startswith('/files') }}">My files</a>
    {% if me.admin and not local %}<a href="/admin" class="{{ 'on' if path.startswith('/admin') }}">Admin</a>{% endif %}
  </nav>
  <div class="me">
    <span class="chip"><span class="avatar">{{ me.label[:1]|upper }}</span>{{ me.label }}</span>
    {% if not local %}
    <form method="post" action="/logout"><button class="link">Sign out</button></form>
    {% endif %}
  </div>
  {% endif %}
</header>
<main>
  {% if flash %}<div class="flash {{ flash.tone }}">{{ flash.message }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
