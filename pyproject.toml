[project]
name = "job-hunter"
version = "0.1.0"
description = "Daily job search, CV tailoring, application prep and tracker dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typst>=0.13",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "pypdf>=4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
boards = ["python-jobspy>=1.1"]
llm = ["anthropic>=0.40"]
apply = ["playwright>=1.45"]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=job_hunter --cov-report=term-missing:skip-covered"
